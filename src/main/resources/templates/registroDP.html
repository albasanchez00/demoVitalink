<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro VitaLink</title>
    <link rel="shortcut icon" href="./media/favicon_IA_Medica.ico}" type="image/x-icon">
    <script src="./static/js/script.js" defer></script>
    <script src="./static/js/register.js" defer></script>
    <link rel="stylesheet" href="./static/css/style.css">
</head>
<body>
    <section>
        <div th:replace="~{fragments/header :: header}"></div>

        <main>
            <section class="section_main_registro">
                <section class="section_form_registro">
                    <h2 th:text="${usuario?.id == 0 ? 'Nuevo Cliente' : 'Editar Cliente'}"></h2>
                    <form id="form-registro" th:action="@{/guardarDatosUsuario}" method="POST"  th:object="${cliente}" novalidate>
                        <p>
                            <label for="nombre">Nombre:<strong>*</strong></label>
                            <input type="text" name="nombre" id="nombre" required>
                        </p>
                        <p>
                            <label for="apellidos">Apellidos:</label>
                            <input type="text" id="apellidos" name="apellidos">
                        </p>
                        <p>
                            <label for="nacimiento">Fecha de Nacimiento:</label>
                            <input type="date" id="nacimiento" name="nacimiento" required>
                        </p>
                        <p>
                            <label for="correoElectronico">Correo Electrónico:<strong>*</strong></label>
                            <input type="email" name="correoElectronico" id="correoElectronico" required>
                        </p>
                        <p>
                            <label for="telefono">Teléfono:<strong>*</strong></label>
                            <input type="tel"
                                   id="telefono"
                                   name="telefono"
                                   required
                                   aria-required="true"
                                   pattern="[0-9]{9}"
                                   maxlength="9"
                                   placeholder="Ejemplo: 123456789"
                                   autocomplete="tel">
                        </p>
                        <p id="document_id">
                            <label for="tipoDocumento">Tipo de documento:<strong>*</strong></label>
                            <select name="tipoDocumento" id="tipoDocumento" required aria-required="true">
                                <option value="dni">DNI</option>
                                <option value="nif">NIF</option>
                            </select>
                            <input type="text"
                                   id="numeroIdentificacion"
                                   name="numeroIdentificacion"
                                   required
                                   aria-required="true"
                                   maxlength="9"
                                   pattern="[0-9A-Za-z]{9}"
                                   placeholder="Número de documento">
                        </p>
                        <p>
                            <label for="numeroTarjetaSanitaria">Nº Tarjeta Sanitaria:</label>
                            <input type="text" id="numeroTarjetaSanitaria" name="numeroTarjetaSanitaria" required>
                        </p>
                        <p>
                            <label for="genero">Género:</label>
                            <select name="genero" id="genero" required>
                                <option value="femenino">Femenino</option>
                                <option value="masculino">Masculino</option>
                                <option value="otro">Otro</option>
                            </select>
                        </p>
                        <p>
                            <label for="direccion">Dirección:</label>
                            <input type="text" id="direccion" name="direccion" required>
                        </p>
                        <p>
                            <label for="ciudadId">Ciudad:<strong>*</strong></label>
                            <select id="ciudadId" name="ciudadId">
                                <option value="">Seleccione una ciudad</option>
                                <!-- Opciones dinámicas si usas JS -->
                            </select>
                        </p>
                        <p>
                            <label for="cpId">Código Postal:</label>
                            <input type="text" id="cpId" name="cpId" required>
                        </p>
                        <p>
                            <label for="password">Contraseña:</label>
                            <input type="password" id="password" name="password" required>
                        </p>
                        <p>
                            <label for="rol">Tipo de Cliente:</label>
                            <select id="rol" name="rol">
                                <option value=""></option>
                                <option value="User">Usuario</option>
                                <option value="Admin">Admin</option>
                            </select>
                        </p>
                        <p class="politicsUse">
                            <input type="checkbox" id="politcs_privacy" name="politcs">
                            <label for="politcs_privacy">Acepto los <a href="#"><strong>Términos y Condiciones</strong></a></label>
                        </p>
                        <p>
                            <button type="submit" id="btn-submit">Enviar</button>
                        </p>
                    </form>
                    <div th:if="${param.error}" class="">
                        El usuario o contraseña no es válido
                    </div>
                    <div th:if="${error!=null}" th:text="${error}" class="alert alert-danger" role="alert"></div>

                </section>
            </section>
        </main>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </section>
</body>
</html>
